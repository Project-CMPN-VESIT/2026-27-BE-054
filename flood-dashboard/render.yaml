services:
  - type: web
    name: drms-flood-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SERVE_FRONTEND
        value: "true"
